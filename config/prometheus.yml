# Prometheus Configuration for ΛΕΩΝΙΔΑΣ-AI PHALANX
# Monitorizare metrici pentru Falanga Digitală

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'sparta-phalanx'
    monitor: 'leonidas-monitor'

# Alertmanager configuration (optional)
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets: ['alertmanager:9093']

# Scrape configurations
scrape_configs:
  # ΛΕΩΝΙΔΑΣ-AI PHALANX API
  - job_name: 'leonidas-api'
    metrics_path: '/api/v1/metrics'
    scheme: 'http'
    bearer_token: 'SPARTA300_SECRET_TOKEN'
    static_configs:
      - targets: ['leonidas-core:7300']
        labels:
          service: 'leonidas-core'
          component: 'api'

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Redis monitoring (if redis_exporter is added)
  # - job_name: 'redis'
  #   static_configs:
  #     - targets: ['redis-exporter:9121']

  # PostgreSQL monitoring (if postgres_exporter is added)
  # - job_name: 'postgres'
  #   static_configs:
  #     - targets: ['postgres-exporter:9187']
